org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The pub cache lives on C: while this project is on F:. Kotlin's incremental
# compiler stores cache keys as paths relative to the project root, and it
# cannot relativise across Windows drive letters — every plugin compiled from
# the cache dies with "this and base files have different roots" and the
# release build fails. Turning incremental compilation off sidesteps the
# relocatable path store entirely; the cost is a slower clean Kotlin compile.
kotlin.incremental=false
